<style>
  :root {
    --pink: rgb(236, 72, 153);
    --purple: rgb(168, 85, 247);
    --blue: rgb(96, 165, 250);
    --gradient-brand: linear-gradient(
      90deg,
      var(--pink) 0%,
      var(--purple) 50%,
      var(--blue) 100%
    );
  }

  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background-color: #08080d;
    color: White;
    padding: 40px;
  }

  .display-title {
    font-size: 68px;
    line-height: 1.05; /* tight lines */
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 24px;
  }

  /* Exercise 3.2: Coloring "Everyday" */
  .gradient-text {
    background: var(
      --gradient-brand
    ); /* Paint a gradient as the background of the text element */
    -webkit-background-clip: text; /* Clip that background to the shape of the letters */
    background-clip: text;
    -webkit-text-fill-color: transparent; /* Make the letter color transparent so the gradient shows through */
    color: transparent;
  }

  /* Exercise 3.3: Making the color in 'Everyday' move. */
  .shimmer {
    background: var(--gradient-brand);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradient-wave 4s linear infinite;
  }

  @keyframes gradient-wave {
    to {
      background-position: -200% center;
    }
  }

  .design-paragraph {
    color: #9ca3af;
    font-size: 18px;
    line-height: 1.6;
    max-width: 380px;
  }
</style>

<!-- Exercise 3.1 - Create and prepare a sub-heading for future design. -->
<h1 class="display-title">
  Elevate your<br />
  <span class="gradient-text shimmer">Everyday</span>
</h1>

<!-- Exercise 3.4 - Designing a paragraph. -->
<p class="design-paragraph">
  Discover premium electronics, fashion, and essentials for your everyday
  lifestyle.
</p>
