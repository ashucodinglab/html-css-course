<style>
  :root {
    --pink: rgb(236, 72, 153);
    --purple: rgb(168, 85, 247);
    --blue: rgb(96, 165, 250);
    --gradient-brand: linear-gradient(
      90deg,
      var(--pink) 0%,
      var(--purple) 50%,
      var(--blue) 100%
    );
  }

  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background-color: #08080d;
    color: White;
    padding: 40px;
  }

  /* The window: shows exactly one slide at a time */
  .slider {
    max-width: 640px;
    overflow: hidden;
    border-radius: 16px;
  }

  /* The film strip: will hold 4 slides side by side = 400% wide */
  .track {
    display: flex;
    width: 400%;
    animation: slide 8s ease-in-out infinite;
  }

  .slider:hover .track {
    animation-play-state: paused;
  }

  /* Each image is a quarter of the track = one full window */
  .track img {
    width: 25%;
    height: auto;
  }

  @keyframes slide {
    0%,
    27% {
      transform: translateX(0);
    }
    33%,
    60% {
      transform: translateX(-25%);
    }
    66%,
    93% {
      transform: translateX(-50%);
    }
    100% {
      transform: translateX(-75%);
    }
  }
</style>

<!-- Exercise 4.1: Designing an auto-sliding window. -->
<div class="slider">
  <div class="track">
    <img src="intro-images/hero.png" alt="Premium products showcase" />
    <img src="intro-images/hero-2.png" alt="Ultra Notebook" />
    <img src="intro-images/hero-3.png" alt="Air Fryer Compact" />
    <!-- Slide 4 = slide 1 is the secret of a seamless loop.-->
    <img src="intro-images/hero.png" alt="Premium products showcase" />
  </div>
</div>
